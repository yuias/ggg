[package]
name = "ggg-gui"
version = "0.7.0"
edition = "2024"
authors = ["yuinshielAs"]
description = "Native GUI front end for ggg"
license = "MIT"

[[bin]]
name = "ggg-gui"
path = "src/main.rs"

[dependencies]
ggg = { path = ".." }
anyhow = "1"
fluent-bundle = "0.16"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui_extras = "0.37"
egui_system_font_provider = "0.37"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
pollster = "0.4"
uuid = "1"
serde_json = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
toml = "1.0"
arboard = "3"

[target.'cfg(windows)'.dependencies]
ggg-ipc = { path = "../windows/ggg-ipc" }
muda = { version = "0.21", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3.8"
serial_test = "4.0.1"
egui_kittest = "0.37"
