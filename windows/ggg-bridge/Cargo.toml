[package]
name = "ggg-bridge"
version = "0.1.0"
edition = "2024"
authors = ["yuinshielAs"]
description = "Chrome Native Messaging host that bridges browser extensions to ggg's Named Pipe"
license = "MIT"

[[bin]]
name = "ggg-bridge"
path = "src/main.rs"

[dependencies]
ggg-ipc = { path = "../ggg-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.8"
uuid = { version = "1", features = ["v4"] }
